<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>管理後台 - 實時監控</title>
    <!-- 【已修正】引入正確且完整的 PeerJS 核心功能 -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; text-align: center; padding: 20px; }
        #remote-video { width: 100%; max-width: 800px; background: #000; border: 3px solid #333; border-radius: 8px; margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; background: #007bff; color: white; }
        button:hover { background: #0056b3; }
        .info { margin-bottom: 15px; color: #aaa; }
    </style>
</head>
<body>

    <h2>控制後台 - 實時影像接收</h2>
    <div class="info">目標頻道: <span id="target-id">正在載入...</span></div>
    <button onclick="connectToTablet()">主動連接平板鏡頭</button>
    <br>
    <video id="remote-video" autoplay playsinline></video>

    <script>
    const TARGET_ID = "live-monitor-channel-12345"; 
    document.getElementById("target-id").innerText = TARGET_ID;

    // 初始化設定，加入 Google 免費的穿透伺服器防止跨網路失敗
    const peer = new Peer({
        config: {
            'iceServers': [
                { url: 'stun:://google.com' },
                { url: 'stun:://google.com' }
            ]
        }
    });

    peer.on('open', function(id) {
        console.log('後台初始化成功，連線 ID: ' + id);
    });

    function connectToTablet() {
        console.log("正在嘗試連接到平板: " + TARGET_ID);
        
        // 【已修正】先請求一個純影像（不含聲音）的軌道進行握手，提高連線成功率
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
        .then(function(dummyStream) {
            const call = peer.call(TARGET_ID, dummyStream);
            
            call.on('stream', function(remoteStream) {
                console.log("成功接收到平板影像串流");
                const remoteVideo = document.getElementById("remote-video");
                remoteVideo.srcObject = remoteStream;
            });
        })
        .catch(function(err) {
            console.log("後台端未提供相機軌道，改用備用方案連線...");
            // 備用方案：若後台裝置沒相機，則直接嘗試空串流呼叫
            const call = peer.call(TARGET_ID, new MediaStream());
            call.on('stream', function(remoteStream) {
                const remoteVideo = document.getElementById("remote-video");
                remoteVideo.srcObject = remoteStream;
            });
        });
    }
    </script>

</body>
</html>
